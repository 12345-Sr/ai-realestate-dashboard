services:
  - type: web
    name: ai-realestate-dashboard
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: realestate_portal
      - key: DASH_USER
        value: admin
      - key: DASH_PASS
        sync: false
